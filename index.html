<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aeropath Autonomy - PDF Report Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #091a23; color: #e9f6f8; padding: 40px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #112b38; border: 1px solid #30505a; padding: 30px; border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 18px; }
    h2 { margin: 0 0 5px 0; font-size: 20px; color: #43dbe0; letter-spacing: 0.05em; text-align: center; }
    p.subtitle { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #90a8b3; text-align: center; }
    .input-group { display: flex; gap: 12px; }
    .input-box { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #8ba7b0; font-weight: bold; }
    input { background: #0a202a; border: 1px solid #30505a; color: #fff; font-size: 22px; font-weight: bold; text-align: center; padding: 12px; border-radius: 6px; text-transform: uppercase; outline: none; letter-spacing: 0.1em; }
    input:focus { border-color: #43dbe0; box-shadow: 0 0 8px rgba(67,219,224,0.3); }
    button { background: linear-gradient(135deg, #43dbe0, #1caab8); border: none; padding: 14px; font-weight: bold; cursor: pointer; color: #0b2530; font-size: 15px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 10px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Aeropath Autonomy</h2>
    <p class="subtitle">B737 Max 8 PDF Report Generator</p>
    
    <div class="input-group">
      <div class="input-box">
        <label for="dep">Departure</label>
        <input id="dep" maxlength="4" value="KJFK">
      </div>
      <div class="input-box">
        <label for="arr">Arrival</label>
        <input id="arr" maxlength="4" value="KPDX">
      </div>
    </div>

    <button onclick="generatePDF()">Download Formatted PDF</button>
  </div>

  <script>
    function generatePDF() {
      let dep = document.getElementById('dep').value.toUpperCase().trim();
      let arr = document.getElementById('arr').value.toUpperCase().trim();

      if(dep.length !== 4 || arr.length !== 4) {
        alert("Please enter valid 4-letter ICAO codes.");
        return;
      }

      // Exact algorithm parameters & formulas implementation
      let d = 2084.5; 
      let k = 25;     
      let w = 0.1 * k; 
      let a = 1 + (15 / 100); 
      let t = 1.05;   
      let p = 1.0;    
      let density = 1.225; 

      let clear = ((d * ((a + t) * w)) / p) * (1 + density);
      let r = 35; 
      let l = 5;  
      let storm = ((d * ((0.6 * r) + (0.4 * l) * w)) / p) * (1 + density);
      let s_n = clear + storm + 0; 
      
      let maxRange = 3550;
      let salvagedDistance = 50;
      let effectiveRange = maxRange - (salvagedDistance + w);
      let clearance = (0.1 * k) * 1000;

      // Initialize jsPDF
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("Helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(13, 35, 58);
      doc.text("AEROPATH AUTONOMY FLIGHT TEST & ALGORITHM REPORT", 14, 20);

      doc.setFont("Helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(92, 115, 138);
      doc.text(`ROUTE: ${dep} TO ${arr} | AIRCRAFT: BOEING 737 MAX 8`, 14, 26);
      doc.text(`GENERATED: ${new Date().toUTCString()}`, 14, 32);

      doc.setDrawColor(200, 205, 210);
      doc.line(14, 38, 196, 38);

      let y = 46;
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(27, 58, 91);
      doc.text("1. Environmental & Weather Profile", 14, y);
      
      y += 6;
      doc.setFont("Helvetica", "normal");
      doc.setFontSize(9.5);
      doc.setTextColor(40, 40, 40);
      doc.text(`• Wind Speed (k): ${k} knots (Headwind component)`, 18, y); y += 5;
      doc.text(`• Radar Reflectivity (r): ${r} dBZ`, 18, y); y += 5;
      doc.text(`• Lightning Flash Rate (l): ${l} flashes/min/3NM`, 18, y); y += 5;
      doc.text(`• Air Density (rho): ${density} kg/m³`, 18, y);

      y += 10;
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(27, 58, 91);
      doc.text("2. Step-by-Step Algorithm & Thinking Log", 14, y);
      
      y += 6;
      doc.setFont("Helvetica", "normal");
      doc.setFontSize(9);
      doc.text("[Step 01] Gate & Surface Taxi: Computed initial vector from gate apron to active runway threshold heading.", 18, y); y += 5;
      doc.text("[Step 02] Takeoff & Climb Profile: Vertical gradient calculation capped at FL370 cruise altitude.", 18, y); y += 5;
      doc.text("[Step 03] Enroute Cruise & Turn Blending: Great-circle trajectory evaluated with strict 1.6 NM turn radius.", 18, y); y += 5;
      doc.text("[Step 04] Descent & Approach: Top-of-descent calculation factoring headwind penalization and decelerations.", 18, y); y += 5;
      doc.text("[Step 05] Landing & Gate Arrival: Localizer centerline alignment vector and final block-in routing.", 18, y);

      y += 10;
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(27, 58, 91);
      doc.text("3. Exact Formula & Cost Evaluation", 14, y);
      
      y += 6;
      doc.setFont("Helvetica", "normal");
      doc.setFontSize(9.5);
      doc.text(`• Wind Cost (w = 0.1 * k): ${w.toFixed(2)}`, 18, y); y += 5;
      doc.text(`• Angle Cost (a = 1 + angle/100): ${a.toFixed(2)}`, 18, y); y += 5;
      doc.text(`• Clear Air Cost [clear = ((d*((a+t)*w))/p)*(1+density)]: ${clear.toFixed(2)}`, 18, y); y += 5;
      doc.text(`• Storm Cost [storm = ((d*((.6r)+(.4l)*w))/p)*(1+density)]: ${storm.toFixed(2)}`, 18, y); y += 5;
      doc.text(`• Total Step Cost (s ₙ = clear + storm): ${s_n.toFixed(2)}`, 18, y); y += 5;
      doc.text(`• Effective Range: ${effectiveRange.toFixed(2)} NM (Max Range: ${maxRange} NM)`, 18, y); y += 5;
      doc.text(`• Thunderstorm Vertical Clearance [(.1k) * 1000]: ${clearance.toFixed(0)} ft above storm`, 18, y);

      y += 10;
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(27, 58, 91);
      doc.text("4. Operational Limits & Status", 14, y);
      
      y += 6;
      doc.setFont("Helvetica", "normal");
      doc.setFontSize(9.5);
      doc.text(`• Radar Limit Check (r <= 50): PASSED (${r} <= 50)`, 18, y); y += 5;
      doc.text(`• Lightning Limit Check (l <= 15): PASSED (${l} <= 15)`, 18, y); y += 5;
      doc.text(`• Wind Limit Check (k <= 30): PASSED (${k} <= 30)`, 18, y); y += 5;
      doc.text(`• Algorithm Route Status: NOMINAL`, 18, y);

      // Save PDF
      doc.save(`${dep}_to_${arr}_Aeropath_Flight_Report.pdf`);
    }
  </script>

</body>
</html>
